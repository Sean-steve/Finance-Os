name: Finance OS Backend B0 Certification
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/backend/**'
      - '.github/workflows/backend-b0.yml'
  push:
    branches: [main, 'phase-b0/**']
    paths:
      - 'backend/**'
      - 'docs/backend/**'
      - '.github/workflows/backend-b0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    name: OpenAPI, TypeScript, Postgres migrations and RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finance_migrator
          POSTGRES_PASSWORD: ci-migrator-only
          POSTGRES_DB: finance_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finance_migrator -d finance_os_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      MIGRATION_DATABASE_URL: postgresql://finance_migrator:ci-migrator-only@127.0.0.1:5432/finance_os_test
      TEST_APP_DATABASE_URL: postgresql://finance_app:ci-app-only@127.0.0.1:5432/finance_os_test
      PGPASSWORD: ci-migrator-only
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm install --prefix backend --no-audit --no-fund
      - name: TypeScript strict build
        run: npm --prefix backend run build
      - name: Validate machine-readable OpenAPI
        run: npm --prefix backend run contract:check
      - name: Unit and contract tests
        run: npm --prefix backend test
      - name: Apply checksum-verified migrations
        run: npm --prefix backend run migrate
      - name: Provision isolated read-only API role
        run: |
          psql -h 127.0.0.1 -p 5432 -U finance_migrator -d finance_os_test \
            -v app_password="ci-app-only" -f backend/scripts/provision-app-role.sql
      - name: Exercise database integrity and RLS using two separate credentials
        run: npm --prefix backend run test:db
      - name: Migration idempotence and drift protection
        run: npm --prefix backend run migrate
