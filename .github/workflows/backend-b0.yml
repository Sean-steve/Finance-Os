name: Finance OS Backend B0 — PostgreSQL and API Contracts
on:
  workflow_dispatch:
  push:
    branches: [main, 'phase-b0/**']
    paths:
      - 'backend/**'
      - 'docs/BACKEND_B0_ARCHITECTURE.md'
      - 'docs/ADR_B0_001.md'
      - '.github/workflows/backend-b0.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/BACKEND_B0_ARCHITECTURE.md'
      - 'docs/ADR_B0_001.md'
      - '.github/workflows/backend-b0.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance_os
          POSTGRES_PASSWORD: testing-only-in-ci
          POSTGRES_DB: finance_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_os -d finance_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://finance_os:testing-only-in-ci@127.0.0.1:5432/finance_os
      DATABASE_SSL_MODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check B0 source and contract tests
        run: npm run check
      - name: Apply checksummed migrations
        run: npm run db:migrate
      - name: Verify migration idempotence and checksum
        run: |
          npm run db:migrate
          npm run db:check
      - name: Test actual PostgreSQL invariants
        run: B0_INTEGRATION_TEST=1 npm test
      - name: Verify database index and RLS policy inventory
        run: |
          node -e "const pg=require('pg');(async()=>{const c=new pg.Client({connectionString:process.env.DATABASE_URL});await c.connect();const a=await c.query(\"SELECT count(*)::int AS n FROM pg_tables WHERE schemaname='public' AND rowsecurity=true\");if(a.rows[0].n<10)process.exitCode=1;console.log('RLS tables',a.rows[0].n);await c.end()})().catch(e=>{console.error(e);process.exitCode=1})"
