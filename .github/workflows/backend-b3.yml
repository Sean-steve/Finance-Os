name: Finance OS Backend B3 — Income, Obligations & Cash Flow Certification
on:
  workflow_dispatch:
  push:
    branches: [main, 'phase-b3/**']
    paths:
      - 'backend/**'
      - 'rebuild/connected.*'
      - 'docs/backend/B3_*'
      - '.github/workflows/backend-b3.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'rebuild/connected.*'
      - 'docs/backend/B3_*'
      - '.github/workflows/backend-b3.yml'
permissions:
  contents: read
jobs:
  b3-financial-correctness:
    name: PostgreSQL 17 recurring income, bill evidence, reversals and tenant safety
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finance_migrator
          POSTGRES_PASSWORD: ci-migrator-only
          POSTGRES_DB: finance_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finance_migrator -d finance_os_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      MIGRATION_DATABASE_URL: postgresql://finance_migrator:ci-migrator-only@127.0.0.1:5432/finance_os_test
      TEST_APP_DATABASE_URL: postgresql://finance_app:ci-app-only@127.0.0.1:5432/finance_os_test
      TEST_AUTH_DATABASE_URL: postgresql://finance_auth:ci-auth-only@127.0.0.1:5432/finance_os_test
      PGPASSWORD: ci-migrator-only
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Strict TypeScript and financial OpenAPI
        run: |
          npm --prefix backend run build
          npm --prefix backend run contract:check
      - name: B0-B3 unit and recurrence calendar certification
        run: npm --prefix backend test
      - name: Forward-only checksum-verified migrations and second-run drift test
        run: |
          npm --prefix backend run migrate
          npm --prefix backend run migrate
      - name: Provision separate restricted identity and finance roles
        run: |
          psql -h 127.0.0.1 -U finance_migrator -d finance_os_test \
            -v app_password="ci-app-only" -v auth_password="ci-auth-only" \
            -f backend/scripts/provision-app-role.sql
      - name: B0 SQL RLS and immutable journal invariants
        run: npm --prefix backend run test:db
      - name: B1 manual ledger and reversal acceptance
        run: npm --prefix backend run test:b1
      - name: B1.1 OIDC security and workspace identity acceptance
        run: npm --prefix backend run test:oidc:db
      - name: B2 budgets and two-person guardrails acceptance
        run: npm --prefix backend run test:b2
      - name: B3 real PostgreSQL income and bill settlement acceptance
        run: npm --prefix backend run test:b3
      - name: Check connected 60-route frontend safety
        run: |
          node --check rebuild/connected.js
          node tests/connected-contract.cjs
