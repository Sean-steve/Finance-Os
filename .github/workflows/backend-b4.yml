name: Finance OS Backend B4 — Capital, Goals & Scenario Certification
on:
  workflow_dispatch:
  push:
    branches: [main, 'phase-b4/**']
    paths:
      - 'backend/**'
      - 'rebuild/connected.*'
      - 'tests/connected-contract.cjs'
      - 'docs/backend/B4_*'
      - '.github/workflows/backend-b4.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'rebuild/connected.*'
      - 'tests/connected-contract.cjs'
      - 'docs/backend/B4_*'
      - '.github/workflows/backend-b4.yml'
permissions:
  contents: read
jobs:
  b4-financial-correctness:
    name: PostgreSQL 17 immutable virtual capital, approvals, scenarios & isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finance_migrator
          POSTGRES_PASSWORD: ci-migrator-only
          POSTGRES_DB: finance_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finance_migrator -d finance_os_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      MIGRATION_DATABASE_URL: postgresql://finance_migrator:ci-migrator-only@127.0.0.1:5432/finance_os_test
      TEST_APP_DATABASE_URL: postgresql://finance_app:ci-app-only@127.0.0.1:5432/finance_os_test
      TEST_AUTH_DATABASE_URL: postgresql://finance_auth:ci-auth-only@127.0.0.1:5432/finance_os_test
      PGPASSWORD: ci-migrator-only
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Locked dependency install
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Strict TypeScript and OpenAPI contract validation
        run: |
          npm --prefix backend run build
          npm --prefix backend run contract:check
      - name: B0–B4 unit financial arithmetic/security invariants
        run: npm --prefix backend test
      - name: Apply forward-only migrations, verify checksums and no drift
        run: |
          npm --prefix backend run migrate
          npm --prefix backend run migrate
      - name: Provision least-privilege separated finance and auth roles
        run: |
          psql -h 127.0.0.1 -U finance_migrator -d finance_os_test \
            -v app_password="ci-app-only" -v auth_password="ci-auth-only" \
            -f backend/scripts/provision-app-role.sql
      - name: B0 immutable journal / RLS
        run: npm --prefix backend run test:db
      - name: B1 manual posted ledger/reversals
        run: npm --prefix backend run test:b1
      - name: B1.1 identity tenant boundary
        run: npm --prefix backend run test:oidc:db
      - name: B2 budget and spending controls
        run: npm --prefix backend run test:b2
      - name: B3 income/bills and cashflow
        run: npm --prefix backend run test:b3
      - name: B4 real PostgreSQL virtual capital certification
        run: npm --prefix backend run test:b4
      - name: Connected frontend safety and no fake money
        run: |
          node --check rebuild/connected.js
          node tests/connected-contract.cjs
