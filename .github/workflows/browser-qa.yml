name: Finance OS Browser UX QA
on:
  workflow_dispatch:
  push:
    branches:
      - 'phase-2.2/**'
      - 'fix/**'
      - main
  pull_request:
    paths:
      - 'src/**'
      - 'rebuild/**'
      - 'rebuild.html'
      - 'connected.html'
      - 'connected-config.json'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/browser-qa.yml'
permissions:
  contents: read
jobs:
  chromium:
    name: Functional and responsive Chromium QA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax and smoke checks
        run: |
          npm run check
          npm test
      - name: Install browser runner
        run: |
          npm install --no-save playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Exercise all 60 screens in Chromium
        run: node tests/browser-qa.cjs
      - name: Audit exact approved design image fidelity and interaction hotspots
        run: node tests/reference-fidelity-qa.cjs
      - name: Validate exact reconstruction screens 06–15
        run: node tests/rebuild-batch06-15.cjs
      - name: Validate coded spending and budgeting screens 16–26
        run: node tests/rebuild-batch16-26.cjs
      - name: Test income, bills and cash flow reconstruction screens 27–34
        run: node tests/rebuild-batch27-34.cjs
      - name: Test capital allocation, savings and scenario screens 35–42
        run: node tests/rebuild-batch35-42.cjs
      - name: Test debt, protection, retirement and estate reconstruction Screens 43–49
        run: node tests/rebuild-batch43-49.cjs
      - name: Validate wealth and investment reconstruction Screens 50–55
        run: node tests/rebuild-batch50-55.cjs
      - name: Full 60-route QA for financial health, advisor, reporting, integrations and privacy
        run: node tests/rebuild-batch56-60.cjs
      - name: Validate reconstructed budget Screen 22 and auth responsive layouts
        run: node tests/visual-screen22-qa.cjs
      - name: Test five priority visual corrections and interactions
        run: node tests/priority-screen-fidelity.cjs
      - name: Certify connected 60-route authentication and demo-data segregation
        run: node tests/connected-browser-qa.cjs
      - name: Measure 59 reference screens and adapted Screen 22 visual difference
        run: node tests/visual-parity-score.cjs
      - name: Audit accessibility and color contrast
        if: success()
        run: node tests/accessibility-qa.cjs
      - name: Retain screenshots and QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-os-chromium-visual-qa
          path: qa-artifacts
          if-no-files-found: ignore
          retention-days: 14
