name: Publish Finance OS prototype
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Finance OS Browser UX QA"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Deploy validated static frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify static assets and financial smoke tests
        run: |
          npm run check
          npm test
      - name: Assemble public app only
        run: |
          mkdir -p ./site/src ./site/assets ./site/rebuild
          cp index.html app.html rebuild.html ./site/
          cp src/app.js src/styles.css ./site/src/
          cp rebuild/app.js rebuild/styles.css rebuild/batch06-15.js rebuild/batch06-15.css rebuild/batch16-26.js rebuild/batch16-26.css rebuild/batch27-34.js rebuild/batch27-34.css rebuild/batch35-42.js rebuild/batch35-42.css rebuild/batch43-49.js rebuild/batch43-49.css rebuild/batch50-55.js rebuild/batch50-55.css ./site/rebuild/
          cp assets/*.webp ./site/assets/
          touch ./site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
