name: Visual Fidelity Pass + New Budget Screen 22
on:
  push:
    branches: ['visual/60-screen-fidelity-and-budget22']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check rebuild/app.js
          node --check rebuild/batch06-15.js
          node --check rebuild/batch16-26.js
          node --check rebuild/budget-screen22.js
          node --check tests/visual-repair-budget22.cjs
      - name: Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Budget/editor, detail screens and regression
        run: node tests/visual-repair-budget22.cjs
      - name: QA images and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-os-visual-fidelity-pass-1
          path: qa-artifacts/visual-pass-1
          retention-days: 14
          if-no-files-found: ignore
