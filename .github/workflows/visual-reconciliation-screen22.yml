name: Finance OS Visual Reconciliation and Screen 22 QA
on:
  push:
    branches: ['reconciliation/visual-parity-and-screen-22']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate code
        run: |
          node --check rebuild/app.js
          node --check rebuild/budget-editor22.js
          node --check tests/visual-screen22-qa.cjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Reconstruct and test Screen 22 and Screen 01 visual showcase
        run: node tests/visual-screen22-qa.cjs
      - name: Test existing spending workflows 16–26
        run: node tests/rebuild-batch16-26.cjs
      - name: Archive screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-os-visual-reconciliation-screen22
          path: |
            qa-artifacts/visual-screen22
            qa-artifacts/batch16-26
          if-no-files-found: ignore
          retention-days: 14
