# Dedicated staging services. An externally provisioned TLS PostgreSQL 17 DB and
# HTTPS OIDC MFA IdP are REQUIRED. Nothing here creates live accounts or DNS.
# Both HTTP ports bind to loopback only; add a separate TLS reverse proxy.
name: finance-os-staging
services:
  api:
    build:
      context: ../..
      dockerfile: backend/deploy/api.Dockerfile
    env_file:
      - ${FINANCE_STAGE_API_ENV_FILE:?Set_an_absolute_path_to_private_staging_runtime_environment_file}
    environment:
      NODE_ENV: production
      LOCAL_AUTH_ENABLED: 'false'
      HOST: 0.0.0.0
      PORT: '3101'
    ports:
      - '127.0.0.1:3101:3101'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ['CMD','node','-e',"fetch('http://127.0.0.1:3101/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ../..
      dockerfile: backend/deploy/web.Dockerfile
    environment:
      FINANCE_STAGE_API_ORIGIN: ${FINANCE_STAGE_API_ORIGIN:?Set_real_HTTPS_staging_API_origin}
      FINANCE_STAGE_IDP_ISSUER: ${FINANCE_STAGE_IDP_ISSUER:?Set_real_HTTPS_issuer_URL}
      NGINX_ENVSUBST_FILTER: '^FINANCE_STAGE_'
    volumes:
      - ${FINANCE_STAGE_WEB_CONFIG_FILE:?Set_absolute_path_to_generated_connected_config_json}:/usr/share/nginx/html/connected-config.json:ro
    ports:
      - '127.0.0.1:8080:8080'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 80
    restart: unless-stopped
