services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: finance_os
      POSTGRES_PASSWORD: ${FINANCE_OS_DB_PASSWORD:?Set FINANCE_OS_DB_PASSWORD in the shell or a local .env}
      POSTGRES_DB: finance_os
    volumes:
      - finance_os_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_os -d finance_os"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  finance_os_pgdata:
